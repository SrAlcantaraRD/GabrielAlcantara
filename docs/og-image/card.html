<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>gabrielalcantara.com · social card</title>
<style>
/* The same three faces the site loads, by relative path so the file previews
   over file:// with no build step and no inlined data URIs. */
@font-face {
	font-family: "CardSerif";
	src: url("../../node_modules/@fontsource/newsreader/files/newsreader-latin-300-normal.woff2") format("woff2");
	font-weight: 300;
	font-style: normal;
	font-display: block;
}

@font-face {
	font-family: "CardSerif";
	src: url("../../node_modules/@fontsource/newsreader/files/newsreader-latin-400-normal.woff2") format("woff2");
	font-weight: 400;
	font-style: normal;
	font-display: block;
}

@font-face {
	font-family: "CardMono";
	src: url("../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2");
	font-weight: 100 800;
	font-style: normal;
	font-display: block;
}

@font-face {
	font-family: "CardSans";
	src: url("../../node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2") format("woff2");
	font-weight: 200 800;
	font-style: normal;
	font-display: block;
}

:root {
	/*
	 * The editor asked for 30px on the two label rows. The exporter refuses
	 * anything under 34: a timeline draws the card near 504px wide, so 34px
	 * lands at about 14px on screen. Labels stay at the floor and their rows
	 * follow line-height 1, which moves the margin from 104 to 100.
	 */
	--slot-label: 34px;
	/* The lead sets at 88 in a 96 row: the row is the line's height, so the
	   three-line block keeps its 96 and the type sheds only the empty shoulder. */
	--slot-title: 88px;

	/* Where the labels' ink lands on the shared column. The lead's side bearing
	   is several pixels wide at 88px, so the script hangs the row to this line. */
	--ink-line: 45px;

	/* The masthead row is 40 so the mark fits inside it, not over the rule. The
	   foot row matches it so the two hairlines mirror about the canvas centre. */
	--h-domain: 40px;
	--h-eyebrow: 34px;
	--h-title: 96px;
	--h-sub: 34px;
	--h-foot: 40px;

	/* The frame is the padding, and the padding is the module: 42px to the edge,
	   42px from each block to its hairline, 24px inside the lead group. The
	   blocks take what is left (127px), so the three-line body sits dead centre
	   without a hand-tuned number. */
	--space: 127px;
	--space-tight: 24px;

	--margin: calc(
		(630px - var(--h-domain) - var(--h-eyebrow) - var(--h-title) -
			var(--h-sub) - var(--h-foot) - 2 * var(--space) - 2 * var(--space-tight)) / 2
	);

	--y-domain: var(--margin);
	--y-eyebrow: calc(var(--y-domain) + var(--h-domain) + var(--space));
	--y-title: calc(var(--y-eyebrow) + var(--h-eyebrow) + var(--space-tight));
	--y-sub: calc(var(--y-title) + var(--h-title) + var(--space-tight));
	--y-foot: calc(var(--y-sub) + var(--h-sub) + var(--space));

	/* Each hairline sits the same 42px from the block it closes — the padding
	   again — so the two rules mirror about the canvas centre. */
	--rule-gap-top: 42px;
	--rule-gap-foot: 42px;

	/* The two halves of one row never touch. */
	--foot-gap: 40px;

	/*
	 * The 5% safe zone some feeds crop to — 60 × 31.5px on this canvas, the same
	 * guide the card editor draws. The frame is the padding (42px), which is
	 * inside that band on purpose: a feed that crops 5% shaves 18px of the white
	 * frame and reaches the ink at ~45px. The gutter stays a plain length
	 * because the exporter reads it with parseFloat.
	 */
	--x: 42px;
	--width: 1116px;

	--logo-size: 40px;
	--logo-gap: 16px;

	--paper: #faf8f5;
	--ink: #1a1a1a;
	--ink-muted: #4f4b47;
	--ink-faint: #6f6960;
	--line: #e6e0d6;
	--accent: #9e4e36;
	--sage: #3e5c49;
	--dot: #059669;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { background: var(--paper); }

/* The artboard. Every child is part of the exported image, so nothing here may
   be preview chrome. */
.card {
	position: relative;
	width: 1200px;
	height: 630px;
	overflow: hidden;
	background: var(--paper);
	color: var(--ink);
	-webkit-font-smoothing: antialiased;
}

/* Every slot is one line: nowrap keeps the copy from silently reflowing into a
   second line, and the gate turns the resulting overflow into a failure. */
.slot {
	position: absolute;
	left: var(--x);
	width: var(--width);
	white-space: nowrap;
}

.rule {
	position: absolute;
	left: var(--x);
	width: var(--width);
	height: 1px;
	background: var(--line);
}

.rule--top { top: calc(var(--y-domain) + var(--h-domain) + var(--rule-gap-top)); }
.rule--foot { top: calc(var(--y-foot) - var(--rule-gap-foot)); }

/* The masthead: the mark and the address, on one row. */
.masthead {
	top: var(--y-domain);
	height: var(--h-domain);
	line-height: var(--h-domain);
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: var(--foot-gap);
	font-family: "CardMono", ui-monospace, monospace;
	font-size: var(--slot-label);
	font-weight: 400;
	color: var(--ink-faint);
}

.lockup {
	display: inline-flex;
	align-items: center;
	gap: var(--logo-gap);
	flex: none;
	/* The A's base is its left-most ink: hanging the lockup 4px lines the mark
	   up with the ink of the three text rows instead of sitting inside them. */
	margin-left: -4px;
}

.mark {
	display: inline-flex;
	flex: none;
	width: var(--logo-size);
	height: var(--logo-size);
	color: var(--ink);
}

.mark svg { display: block; width: 100%; height: 100%; }

/* The type nudges are a property of the text, not of the row: the grid stays
   on its declared tops and the gate can still measure the rhythm. */
.masthead .domain {
	display: inline-block;
	letter-spacing: -.01em;
	transform: translate(-2px, -2px);
}

/* The kicker: sans at label size, tracked, in the faint ink. */
.eyebrow {
	top: var(--y-eyebrow);
	height: var(--h-eyebrow);
	line-height: var(--h-eyebrow);
	font-family: "CardSans", ui-sans-serif, system-ui, sans-serif;
	font-size: var(--slot-label);
	font-weight: 400;
	letter-spacing: .1em;
	text-transform: none;
	color: var(--ink-faint);
}

.eyebrow span,
.lead span {
	display: inline-block;
}

.eyebrow span { transform: translate(0, -2px); }

.lead {
	top: var(--y-title);
	height: var(--h-title);
	line-height: var(--h-title);
	font-family: "CardSans", ui-sans-serif, system-ui, sans-serif;
	font-size: var(--slot-title);
	font-weight: 300;
	letter-spacing: -.02em;
	color: var(--ink);
}

/*
 * The lead's ink, not its box, is what lines up with the labels: at 88px the
 * sans' side bearing pushes the first letter five or six pixels right, and it
 * differs by letter. The script measures that bearing once the face is loaded
 * and hangs the row by it; the exporter caps the overhang.
 */
.lead span { transform: translate(var(--lead-hang, 0px), 0); }

/* The line that explains the title: sans at label size, tracked, in the accent. */
.sub {
	top: var(--y-sub);
	height: var(--h-sub);
	line-height: var(--h-sub);
	font-family: "CardSans", ui-sans-serif, system-ui, sans-serif;
	font-size: var(--slot-label);
	font-weight: 400;
	letter-spacing: .1em;
	color: var(--accent);
}

/*
	 * The editor pulled this line 28px up, into the lead's row. It now sits on
	 * its own row: the two lines no longer touch, and the gap above reads as a
	 * gap instead of a collision.
	 */
.sub span {
	display: inline-block;
	transform: translate(0, 0);
}

.foot {
	top: var(--y-foot);
	left: var(--x);
	right: var(--x);
	width: auto;
	height: var(--h-foot);
	line-height: var(--h-foot);
	display: flex;
	align-items: flex-end;
	justify-content: space-between;
	gap: var(--foot-gap);
	font-family: "CardMono", ui-monospace, monospace;
	font-size: var(--slot-label);
	font-weight: 400;
	letter-spacing: .02em;
	color: var(--ink-faint);
}

.foot .right { flex: none; }

.foot span { display: inline-block; transform: translate(0, 1px); }

[hidden] { display: none !important; }
</style>
</head>
<body>

<div class="card" id="card" data-kind="default" role="img">
	<div class="rule rule--top" aria-hidden="true"></div>
	<div class="rule rule--foot" aria-hidden="true"></div>

	<div class="masthead slot" data-slot="domain">
		<span class="lockup">
			<span class="mark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 128 128"><path fill="currentColor" d="M50.4 78.5a75.1 75.1 0 0 0-28.5 6.9l24.2-65.7c.7-2 1.9-3.2 3.4-3.2h29c1.5 0 2.7 1.2 3.4 3.2l24.2 65.7s-11.6-7-28.5-7L67 45.5c-.4-1.7-1.6-2.8-2.9-2.8-1.3 0-2.5 1.1-2.9 2.7L50.4 78.5Zm-1.1 28.2Zm-4.2-20.2c-2 6.6-.6 15.8 4.2 20.2a17.5 17.5 0 0 1 .2-.7 5.5 5.5 0 0 1 5.7-4.5c2.8.1 4.3 1.5 4.7 4.7.2 1.1.2 2.3.2 3.5v.4c0 2.7.7 5.2 2.2 7.4a13 13 0 0 0 5.7 4.9v-.3l-.2-.3c-1.8-5.6-.5-9.5 4.4-12.8l1.5-1a73 73 0 0 0 3.2-2.2 16 16 0 0 0 6.8-11.4c.3-2 .1-4-.6-6l-.8.6-1.6 1a37 37 0 0 1-22.4 2.7c-5-.7-9.7-2-13.2-6.2Z"/></svg></span>
			<span class="domain" id="domain">gabrielalcantara.com</span>
		</span>
	</div>

	<p class="eyebrow slot" data-slot="eyebrow"><span id="eyebrow">Barcelona · remoto</span></p>
	<h1 class="lead slot" data-slot="title"><span id="lead">Gabriel Alcántara</span></h1>
	<p class="sub slot" data-slot="sub"><span id="sub">Solutions Architect · Software Engineer</span></p>

	<footer class="foot slot" data-slot="foot">
		<span id="footLeft">CLOUD · EDA · DDD</span>
		<span class="right" id="footRight">desde 2011</span>
	</footer>
</div>

<script>
(function () {
	var card = document.getElementById('card');
	var eyebrow = document.getElementById('eyebrow');
	var lead = document.getElementById('lead');
	var sub = document.getElementById('sub');
	var footLeft = document.getElementById('footLeft');
	var footRight = document.getElementById('footRight');
	var domain = document.getElementById('domain');

	var inkContext = document.createElement('canvas').getContext('2d');

	// Where the first glyph's ink starts, in card coordinates: the box is not
	// the ink, and on a display line the bearing is several pixels wide.
	function inkLeft(element) {
		var style = getComputedStyle(element);
		inkContext.font = style.fontWeight + ' ' + style.fontSize + ' ' + style.fontFamily;
		var metrics = inkContext.measureText(element.textContent.trim());
		return element.getBoundingClientRect().left - metrics.actualBoundingBoxLeft;
	}

	// The labels' ink lands on one line; the lead hangs until its own ink does
	// too, so the three-line block reads as a single column of type.
	function alignLead() {
		if (!lead.textContent.trim()) return;
		var line = Number.parseFloat(getComputedStyle(card).getPropertyValue('--ink-line'));
		if (!isFinite(line)) line = 45;
		var hang = Math.round((line - inkLeft(lead)) * 2) / 2;
		lead.style.setProperty('--lead-hang', hang + 'px');
	}

	function setText(element, value) {
		element.textContent = value == null ? '' : String(value);
		return element.textContent.trim();
	}

	function render(copy) {
		card.dataset.kind = copy.kind === 'case' || copy.kind === 'post' ? copy.kind : 'default';
		document.documentElement.lang = 'es';

		// A bare open of this file has no query: keep the copy already in the
		// markup so the artboard is always previewable, and let the exporter (or a
		// query parameter) override it.
		if (copy.domain != null) setText(domain, copy.domain);
		if (copy.eyebrow != null) setText(eyebrow, copy.eyebrow);
		if (copy.title != null) setText(lead, copy.title);
		if (copy.sub != null) setText(sub, copy.sub);

		// The lead's ink has to land on the labels' ink, so the hang is measured
		// once the copy and the face are in place, not guessed from the initial.
		lead.style.setProperty('--lead-hang', '0px');
		if (copy.footLeft != null) setText(footLeft, copy.footLeft);
		if (copy.footRight != null) footRight.hidden = !setText(footRight, copy.footRight);

		card.setAttribute('aria-label', [
			domain.textContent.trim(),
			eyebrow.textContent.trim(),
			lead.textContent.trim(),
			sub.textContent.trim(),
		].filter(Boolean).join('. ').concat('.'));

		// The slots never resize, but whether the copy overflows depends on the
		// real faces, so the promise waits for the webfonts before the gate reads
		// the layout.
		var fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
		return fonts.then(function () {
			alignLead();
			return { kind: card.dataset.kind };
		});
	}

	// export.mjs calls this after the page has loaded (no location.search there).
	window.__setCard = render;

	var query = new URLSearchParams(location.search);
	var scale = Number(query.get('scale'));
	if (scale > 0) document.body.style.zoom = String(scale / 1200);

	render({
		kind: query.get('kind') || 'default',
		domain: query.get('domain'),
		title: query.get('title'),
		sub: query.get('sub'),
		eyebrow: query.get('eyebrow'),
		footLeft: query.get('footLeft'),
		footRight: query.get('footRight'),
	}).then(function (report) {
		window.__cardReady = report;
	});
})();
</script>
</body>
</html>
