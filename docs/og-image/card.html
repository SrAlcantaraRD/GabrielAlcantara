<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>gabrielalcantara.com · social card</title>
<style>
/* The same three faces the site loads, by relative path so the file previews
   over file:// with no build step and no inlined data URIs. */
@font-face {
	font-family: "CardSerif";
	src: url("../../node_modules/@fontsource/newsreader/files/newsreader-latin-300-normal.woff2") format("woff2");
	font-weight: 300;
	font-style: normal;
	font-display: block;
}

@font-face {
	font-family: "CardSerif";
	src: url("../../node_modules/@fontsource/newsreader/files/newsreader-latin-400-normal.woff2") format("woff2");
	font-weight: 400;
	font-style: normal;
	font-display: block;
}

@font-face {
	font-family: "CardMono";
	src: url("../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2");
	font-weight: 100 800;
	font-style: normal;
	font-display: block;
}

@font-face {
	font-family: "CardSans";
	src: url("../../node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2") format("woff2");
	font-weight: 200 800;
	font-style: normal;
	font-display: block;
}

:root {
	/* Two label sizes and one display size. The heights and the two gaps derive
	   all five tops, so the rhythm cannot drift and export.mjs can check it. */
	--slot-label: 34px;
	--slot-title: 96px;

	--h-domain: 34px;
	--h-eyebrow: 34px;
	--h-title: 96px;
	--h-sub: 46px;
	--h-foot: 34px;

	/* One gap between the three central lines is tight; the two outer gaps and
	   the margin carry the air, so the block reads as a group. */
	--space: 78px;
	--space-tight: 18px;

	--margin: calc(
		(630px - var(--h-domain) - var(--h-eyebrow) - var(--h-title) -
			var(--h-sub) - var(--h-foot) - 2 * var(--space) - 2 * var(--space-tight)) / 2
	);

	--y-domain: var(--margin);
	--y-eyebrow: calc(var(--y-domain) + var(--h-domain) + var(--space));
	--y-title: calc(var(--y-eyebrow) + var(--h-eyebrow) + var(--space-tight));
	--y-sub: calc(var(--y-title) + var(--h-title) + var(--space-tight));
	--y-foot: calc(var(--y-sub) + var(--h-sub) + var(--space));

	/* The hairline sits under the masthead and over the footer: attached to the
	   outer rows, like the site's section rules. */
	--rule-gap: 24px;

	/* The two halves of one row never touch. */
	--foot-gap: 40px;

	--x: 80px;
	--width: 1040px;

	--paper: #faf8f5;
	--ink: #1a1a1a;
	--ink-muted: #4f4b47;
	--ink-faint: #6f6960;
	--line: #e6e0d6;
	--accent: #9e4e36;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { background: var(--paper); }

/* The artboard. Every child is part of the exported image, so nothing here may
   be preview chrome. */
.card {
	position: relative;
	width: 1200px;
	height: 630px;
	overflow: hidden;
	background: var(--paper);
	color: var(--ink);
	-webkit-font-smoothing: antialiased;
}

/* Every slot is one line: nowrap keeps the copy from silently reflowing into a
   second line, and the gate turns the resulting overflow into a failure. */
.slot {
	position: absolute;
	left: var(--x);
	width: var(--width);
	white-space: nowrap;
}

.rule {
	position: absolute;
	left: var(--x);
	width: var(--width);
	height: 1px;
	background: var(--line);
}

.rule--top { top: calc(var(--y-domain) + var(--h-domain) + var(--rule-gap)); }
.rule--foot { top: calc(var(--y-foot) - var(--rule-gap)); }

/* The masthead: one mono line at address size, the way the site labels a
   section, not a logo lockup. */
.masthead {
	top: var(--y-domain);
	height: var(--h-domain);
	line-height: var(--h-domain);
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: var(--foot-gap);
	font-family: "CardMono", ui-monospace, monospace;
	font-size: var(--slot-label);
	font-weight: 400;
	color: var(--ink-faint);
}

.masthead .domain { letter-spacing: -.01em; }

/* The availability badge is the site's one green signal, dot included. */
.masthead .status {
	display: inline-flex;
	align-items: center;
	gap: 14px;
	flex: none;
	letter-spacing: .06em;
	text-transform: uppercase;
	color: #3e5c49;
}

.masthead .status::before {
	content: "";
	width: 12px;
	height: 12px;
	border-radius: 999px;
	background: #059669;
}

/* The kicker: the site's terracotta mono label, tracked and uppercase. */
.eyebrow {
	top: var(--y-eyebrow);
	height: var(--h-eyebrow);
	line-height: var(--h-eyebrow);
	font-family: "CardMono", ui-monospace, monospace;
	font-size: var(--slot-label);
	font-weight: 400;
	letter-spacing: .14em;
	text-transform: uppercase;
	color: var(--accent);
}

.lead {
	top: var(--y-title);
	height: var(--h-title);
	line-height: var(--h-title);
	font-family: "CardSerif", Georgia, "Times New Roman", serif;
	font-size: var(--slot-title);
	font-weight: 300;
	letter-spacing: -.03em;
	color: var(--ink);
}

/* The line that explains the title is body copy on the site, so it is sans. */
.sub {
	top: var(--y-sub);
	height: var(--h-sub);
	line-height: var(--h-sub);
	font-family: "CardSans", ui-sans-serif, system-ui, sans-serif;
	font-size: var(--slot-label);
	font-weight: 400;
	letter-spacing: -.005em;
	color: var(--ink-muted);
}

.foot {
	top: var(--y-foot);
	left: var(--x);
	right: var(--x);
	width: auto;
	height: var(--h-foot);
	line-height: var(--h-foot);
	display: flex;
	align-items: flex-end;
	justify-content: space-between;
	gap: var(--foot-gap);
	font-family: "CardMono", ui-monospace, monospace;
	font-size: var(--slot-label);
	font-weight: 400;
	letter-spacing: .02em;
	color: var(--ink-faint);
}

.foot .right { flex: none; }

[hidden] { display: none !important; }
</style>
</head>
<body>

<div class="card" id="card" data-kind="default" role="img">
	<div class="rule rule--top" aria-hidden="true"></div>
	<div class="rule rule--foot" aria-hidden="true"></div>

	<div class="masthead slot" data-slot="domain">
		<span class="domain" id="domain">gabrielalcantara.com</span>
		<span class="status" id="status">Disponible</span>
	</div>
	<p class="eyebrow slot" id="eyebrow" data-slot="eyebrow">Barcelona · remoto</p>
	<h1 class="lead slot" id="lead" data-slot="title">Gabriel Alcántara</h1>
	<p class="sub slot" id="sub" data-slot="sub">Solutions Architect · Software Engineer</p>

	<footer class="foot slot" data-slot="foot">
		<span id="footLeft">sistemas distribuidos · EDA · DDD</span>
		<span class="right" id="footRight">desde 2011</span>
	</footer>
</div>

<script>
(function () {
	var card = document.getElementById('card');
	var eyebrow = document.getElementById('eyebrow');
	var lead = document.getElementById('lead');
	var sub = document.getElementById('sub');
	var footLeft = document.getElementById('footLeft');
	var footRight = document.getElementById('footRight');
	var domain = document.getElementById('domain');
	var status = document.getElementById('status');

	function setText(element, value) {
		element.textContent = value == null ? '' : String(value);
		element.hidden = !element.textContent.trim();
	}

	function render(copy) {
		card.dataset.kind = copy.kind === 'case' || copy.kind === 'post' ? copy.kind : 'default';
		document.documentElement.lang = 'es';

		if (copy.domain) setText(domain, copy.domain);
		if (copy.status) setText(status, copy.status);
		setText(eyebrow, copy.eyebrow);
		setText(lead, copy.title);
		setText(sub, copy.sub);
		setText(footLeft, copy.footLeft);
		setText(footRight, copy.footRight);

		card.setAttribute('aria-label', [
			domain.textContent.trim(),
			status.textContent.trim(),
			eyebrow.textContent.trim(),
			lead.textContent.trim(),
			sub.textContent.trim(),
		].filter(Boolean).join('. ').concat('.'));

		// The slots never resize, but whether the copy overflows depends on the
		// real faces, so the promise waits for the webfonts before the gate reads
		// the layout.
		var fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
		return fonts.then(function () { return { kind: card.dataset.kind }; });
	}

	// export.mjs calls this after the page has loaded (no location.search there).
	window.__setCard = render;

	var query = new URLSearchParams(location.search);
	var scale = Number(query.get('scale'));
	if (scale > 0) document.body.style.zoom = String(scale / 1200);

	render({
		kind: query.get('kind') || 'default',
		domain: query.get('domain'),
		status: query.get('status'),
		title: query.get('title'),
		sub: query.get('sub'),
		eyebrow: query.get('eyebrow'),
		footLeft: query.get('footLeft'),
		footRight: query.get('footRight'),
	}).then(function (report) {
		window.__cardReady = report;
	});
})();
</script>
</body>
</html>
