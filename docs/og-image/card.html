<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>gabrielalcantara.com · social card</title>
<style>
/* Fonts come from the site's own dependencies by relative path, so the file
   previews over file:// with no build step and no inlined data URIs. */
@font-face {
	font-family: "CardSerif";
	src: url("../../node_modules/@fontsource/newsreader/files/newsreader-latin-400-normal.woff2") format("woff2");
	font-weight: 400;
	font-style: normal;
	font-display: block;
}
@font-face {
	font-family: "CardSerif";
	src: url("../../node_modules/@fontsource/newsreader/files/newsreader-latin-400-italic.woff2") format("woff2");
	font-weight: 400;
	font-style: italic;
	font-display: block;
}
@font-face {
	font-family: "CardSans";
	src: url("../../node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2") format("woff2-variations");
	font-weight: 100 900;
	font-style: normal;
	font-display: block;
}
@font-face {
	font-family: "CardMono";
	src: url("../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2-variations");
	font-weight: 100 800;
	font-style: normal;
	font-display: block;
}

:root {
	/* The card is a rigid template: five slots, each at a fixed height with a
	   fixed size, one line per slot, never reflowed. The copy is edited to fit,
	   and export.mjs refuses to write a card where it does not.

	   34px is the floor because a timeline draws the card near 504px wide, a
	   factor of 0.42; 34px arrives on screen at about 14px. */
	--slot-domain: 34px;
	--slot-eyebrow: 34px;
	--slot-title: 96px;
	--slot-sub: 44px;
	--slot-foot: 34px;

	--x: 80px;
	--width: 1040px;

	/* Top of each line box. These five numbers are the template: with the five
	   slot heights they leave 58px in all six spaces — above the first row,
	   between every pair, and below the last. Changing a size or a line-height
	   means re-solving them, which export.mjs checks. */
	--y-domain: 58px;
	--y-eyebrow: 171px;
	--y-title: 278px;
	--y-sub: 419px;
	--y-foot: 504px;

	--paper: #faf8f5;
	--ink: #1a1a1a;
	--ink-muted: #4f4b47;
	--ink-faint: #6f6960;
	--line: #e6e0d6;
	--accent: #1b7343;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { background: var(--paper); }

/* The artboard. Every child is part of the exported image, so nothing here may
   be preview chrome. */
.card {
	position: relative;
	width: 1200px;
	height: 630px;
	overflow: hidden;
	color: var(--ink);
	font-family: "CardSans", ui-sans-serif, system-ui, sans-serif;
	-webkit-font-smoothing: antialiased;
	background:
		radial-gradient(660px 360px at 106% -10%, rgba(62, 92, 73, .10), transparent 62%),
		radial-gradient(560px 320px at -6% 110%, rgba(41, 76, 96, .08), transparent 60%),
		var(--paper);
}

/* Every slot is one line: nowrap keeps the copy from silently reflowing into a
   second line, and the gate turns the resulting overflow into a failure. */
.slot {
	position: absolute;
	left: var(--x);
	white-space: nowrap;
}

.brand {
	top: var(--y-domain);
	display: flex;
	align-items: center;
	gap: 20px;
	height: 52px;
}

.brand .mark {
	width: 52px;
	height: 52px;
	flex: none;
}

.brand .mark svg {
	display: block;
	width: 100%;
	height: 100%;
}

.domain {
	font-family: "CardMono", ui-monospace, monospace;
	font-size: var(--slot-domain);
	letter-spacing: .01em;
	color: var(--ink-faint);
}

.eyebrow {
	top: var(--y-eyebrow);
	width: var(--width);
	font-family: "CardMono", ui-monospace, monospace;
	font-size: var(--slot-eyebrow);
	line-height: 40px;
	letter-spacing: .05em;
	text-transform: uppercase;
	color: var(--accent);
}

.lead {
	top: var(--y-title);
	width: var(--width);
	font-family: "CardSerif", Georgia, "Times New Roman", serif;
	font-weight: 400;
	font-size: var(--slot-title);
	line-height: 82px;
	letter-spacing: -.022em;
	color: var(--ink);
}

/* One family for the standfirst on every card: the two faces have different
   ascent boxes, and that difference alone would move the gaps above and below
   the row by six pixels between cards. */
.sub {
	top: var(--y-sub);
	width: var(--width);
	font-family: "CardSerif", Georgia, "Times New Roman", serif;
	font-style: italic;
	font-size: var(--slot-sub);
	line-height: 56px;
	letter-spacing: -.005em;
	color: var(--accent);
}

.foot {
	top: var(--y-foot);
	left: var(--x);
	right: var(--x);
	display: flex;
	align-items: baseline;
	justify-content: space-between;
	gap: 40px;
	border-top: 1px solid var(--line);
	padding-top: 24px;
	font-size: var(--slot-foot);
	line-height: 40px;
	color: var(--ink-faint);
}

.foot .right {
	flex: none;
	font-family: "CardMono", ui-monospace, monospace;
	color: var(--accent);
}

[hidden] { display: none !important; }
</style>
</head>
<body>

<div class="card" id="card" data-kind="default" role="img">
	<div class="brand slot" data-slot="domain">
		<span class="mark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 128 128"><path fill="#1a1a1a" d="M50.4 78.5a75.1 75.1 0 0 0-28.5 6.9l24.2-65.7c.7-2 1.9-3.2 3.4-3.2h29c1.5 0 2.7 1.2 3.4 3.2l24.2 65.7s-11.6-7-28.5-7L67 45.5c-.4-1.7-1.6-2.8-2.9-2.8-1.3 0-2.5 1.1-2.9 2.7L50.4 78.5Zm-1.1 28.2Zm-4.2-20.2c-2 6.6-.6 15.8 4.2 20.2a17.5 17.5 0 0 1 .2-.7 5.5 5.5 0 0 1 5.7-4.5c2.8.1 4.3 1.5 4.7 4.7.2 1.1.2 2.3.2 3.5v.4c0 2.7.7 5.2 2.2 7.4a13 13 0 0 0 5.7 4.9v-.3l-.2-.3c-1.8-5.6-.5-9.5 4.4-12.8l1.5-1a73 73 0 0 0 3.2-2.2 16 16 0 0 0 6.8-11.4c.3-2 .1-4-.6-6l-.8.6-1.6 1a37 37 0 0 1-22.4 2.7c-5-.7-9.7-2-13.2-6.2Z"/></svg></span>
		<span class="domain" id="domain">gabrielalcantara.com</span>
	</div>

	<p class="eyebrow slot" id="eyebrow" data-slot="eyebrow">Barcelona · remoto</p>
	<h1 class="lead slot" id="lead" data-slot="title">Gabriel Alcántara</h1>
	<p class="sub slot" id="sub" data-slot="sub">Software Architect · Software Engineer</p>

	<footer class="foot slot" data-slot="foot">
		<span id="footLeft">sistemas distribuidos · EDA · DDD</span>
		<span class="right" id="footRight">desde 2011</span>
	</footer>
</div>

<script>
(function () {
	var card = document.getElementById('card');
	var eyebrow = document.getElementById('eyebrow');
	var lead = document.getElementById('lead');
	var sub = document.getElementById('sub');
	var footLeft = document.getElementById('footLeft');
	var footRight = document.getElementById('footRight');
	var domain = document.getElementById('domain');

	function setText(element, value) {
		element.textContent = value == null ? '' : String(value);
		element.hidden = !element.textContent.trim();
	}

	function render(copy) {
		card.dataset.kind = copy.kind === 'case' || copy.kind === 'post' ? copy.kind : 'default';
		document.documentElement.lang = 'es';

		if (copy.domain) setText(domain, copy.domain);
		setText(eyebrow, copy.eyebrow);
		setText(lead, copy.title);
		setText(sub, copy.sub);
		setText(footLeft, copy.footLeft);
		setText(footRight, copy.footRight);

		card.setAttribute('aria-label', [
			domain.textContent.trim(),
			eyebrow.textContent.trim(),
			lead.textContent.trim(),
			sub.textContent.trim(),
		].filter(Boolean).join('. ').concat('.'));

		// The slots never resize, but whether the copy overflows depends on the
		// real face, so the promise waits for the webfonts before the gate reads
		// the layout.
		var fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
		return fonts.then(function () { return { kind: card.dataset.kind }; });
	}

	// export.mjs calls this after the page has loaded (no location.search there).
	window.__setCard = render;

	var query = new URLSearchParams(location.search);
	var scale = Number(query.get('scale'));
	if (scale > 0) document.body.style.zoom = String(scale / 1200);

	render({
		kind: query.get('kind') || 'default',
		domain: query.get('domain'),
		title: query.get('title'),
		sub: query.get('sub'),
		eyebrow: query.get('eyebrow'),
		footLeft: query.get('footLeft'),
		footRight: query.get('footRight'),
	}).then(function (report) {
		window.__cardReady = report;
	});
})();
</script>
</body>
</html>
