<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="Un productor que escribe en un log de tres particiones y dos consumidores que leen a su ritmo">
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="14" y="62" width="74" height="54" rx="8" fill="#fff" stroke="#e6e0d6"/>
    <text x="24" y="86" font-size="8.5" fill="#1a1a1a">productor</text>
    <text x="24" y="99" font-size="7" fill="#6f6960">escribe</text>

    <path d="M92 89 H110" stroke="#9e4e36" stroke-width="1.2" marker-end="url(#ed-arrow)"/>

    <rect x="116" y="30" width="92" height="120" rx="10" fill="#faf8f5" stroke="#cfc6b8" stroke-dasharray="4 3"/>
    <text x="126" y="46" font-size="7" letter-spacing="1.2" fill="#6f6960">LOG</text>
    <rect x="128" y="54" width="18" height="86" rx="4" fill="#f8efea" stroke="#9e4e36" stroke-width="0.8"/>
    <rect x="153" y="54" width="18" height="86" rx="4" fill="#fff" stroke="#e6e0d6"/>
    <rect x="178" y="54" width="18" height="86" rx="4" fill="#fff" stroke="#e6e0d6"/>

    <path d="M212 66 H234" stroke="#c9c0b2" stroke-width="1.2" marker-end="url(#ed-arrow-muted)"/>
    <path d="M212 114 H234" stroke="#c9c0b2" stroke-width="1.2" marker-end="url(#ed-arrow-muted)"/>

    <rect x="238" y="42" width="68" height="46" rx="8" fill="#fff" stroke="#e6e0d6"/>
    <text x="247" y="70" font-size="8" fill="#4f4b47">consumidor</text>

    <rect x="238" y="92" width="68" height="46" rx="8" fill="#fff" stroke="#e6e0d6"/>
    <text x="247" y="120" font-size="8" fill="#4f4b47">consumidor</text>
  </g>
  <defs>
    <marker id="ed-arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#9e4e36"/>
    </marker>
    <marker id="ed-arrow-muted" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#b8ae9e"/>
    </marker>
  </defs>
</svg>
